<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d0b24; overflow: hidden; touch-action: none; }
  #game { width: 100%; height: 100%; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
const W = 600, H = 900;
const N = 8, CELL = 62, GAP = 4, PITCH = CELL + GAP;
const BOARD = N * PITCH - GAP, BX = (W - BOARD) / 2, BY = 250;
const HEAD = 0x7dffb6, TAIL = 0x1a8f86, FOOD = 0xff5d73;
const FONT = 'Fredoka, system-ui, sans-serif';
const START_MS = 230, MIN_MS = 95, SPEEDUP = 7;
const DIRS = {
  up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
};
const KEYS = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
};

const cellCenter = (x, y) => ({ x: BX + x * PITCH + CELL / 2, y: BY + y * PITCH + CELL / 2 });

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Synthesised sound effects — no audio files needed.
const Sfx = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slideTo = null) {
    if (this.muted) return;
    this.init();
    const ctx = this.ctx, t = ctx.currentTime + delay;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  turn()     { this.tone(1100, 0.03, 'sine', 0.04); },
  eat(n)     { this.tone(500 + n * 18, 0.14, 'triangle', 0.25, 0, 900 + n * 24); },
  start()    { [392, 523, 659].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.18, i * 0.07)); },
  gameOver() {
    this.tone(300, 0.5, 'sawtooth', 0.12, 0, 70);
    [440, 370, 311, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.16, 0.1 + i * 0.12));
  },
  win() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.2, i * 0.09));
    this.tone(1568, 0.7, 'sine', 0.12, 0.45);
  },
};

class Game extends Phaser.Scene {
  constructor() { super('game'); }

  create() {
    this.makeTextures();
    this.makeBackground();

    this.best = Number(store.get('snake-best')) || 0;

    this.add.text(W / 2, 64, 'Snake', {
      fontFamily: FONT, fontSize: '56px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5).setShadow(0, 4, 'rgba(0,0,0,0.4)', 12);

    this.muteBtn = this.add.text(W - 34, 34, '🔊', { fontSize: '28px' })
      .setOrigin(0.5).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => {
        Sfx.muted = !Sfx.muted;
        this.muteBtn.setText(Sfx.muted ? '🔇' : '🔊');
      });

    this.cards = {
      score: this.makeCard(W / 2 - 170, 160, 'SCORE', '#7dffb6'),
      length: this.makeCard(W / 2, 160, 'LENGTH', '#c9c3ff'),
      best: this.makeCard(W / 2 + 170, 160, 'BEST', '#ffc857'),
    };
    this.cards.best.value.setText(String(this.best));

    const board = this.add.graphics();
    board.fillStyle(0xffffff, 0.04).fillRoundedRect(BX - 12, BY - 12, BOARD + 24, BOARD + 24, 24)
      .lineStyle(2, 0xffffff, 0.14).strokeRoundedRect(BX - 12, BY - 12, BOARD + 24, BOARD + 24, 24);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        board.fillStyle(0xffffff, (x + y) % 2 ? 0.045 : 0.075)
          .fillRoundedRect(BX + x * PITCH, BY + y * PITCH, CELL, CELL, 12);
      }
    }

    this.foodG = this.add.graphics();
    this.addGlow(this.foodG, FOOD, 6);
    this.snakeG = this.add.graphics();
    this.addGlow(this.snakeG, HEAD, 3);

    this.emitter = this.add.particles(0, 0, 'spark', {
      speed: { min: 100, max: 380 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 450, max: 900 },
      scale: { start: 0.9, end: 0 },
      gravityY: 250,
      blendMode: 'ADD',
      emitting: false,
    }).setDepth(10);

    this.add.text(W / 2, H - 52, 'Arrows / WASD or swipe  ·  Space to pause  ·  Edges wrap around', {
      fontFamily: FONT, fontSize: '17px', color: '#ffffff',
    }).setOrigin(0.5).setAlpha(0.5);

    this.makeOverlay();
    this.setupInput();
    this.reset();
  }

  // ---------- visuals ----------

  makeTextures() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0xffffff, 1).fillCircle(6, 6, 6);
    g.generateTexture('spark', 12, 12);
    g.destroy();

    // Soft glows and the background gradient are computed per pixel with
    // triangular dither noise, so 8-bit quantisation never shows as bands.
    const dither = () => Math.random() + Math.random() - 1;

    const S = 384;
    this.paintTexture('orb', S, S, (x, y, px, o) => {
      const d = Math.hypot(x - S / 2 + 0.5, y - S / 2 + 0.5) / (S / 2);
      const edge = d >= 1 ? 0 : 1 - d * d * (3 - 2 * d);
      const a = Math.exp(-d * d * 4.5) * edge * 0.42;
      px[o] = px[o + 1] = px[o + 2] = 255;
      px[o + 3] = Math.max(0, Math.min(255, Math.round(a * 255 + dither())));
    });

    const top = [0x2a, 0x16, 0x60], bottom = [0x07, 0x18, 0x2f];
    this.paintTexture('bg', W, H, (x, y, px, o) => {
      const t = Phaser.Math.Easing.Sine.InOut(y / (H - 1));
      for (let c = 0; c < 3; c++) {
        const v = top[c] + (bottom[c] - top[c]) * t + dither();
        px[o + c] = Math.max(0, Math.min(255, Math.round(v)));
      }
      px[o + 3] = 255;
    });
  }

  paintTexture(key, w, h, fn) {
    const tex = this.textures.createCanvas(key, w, h);
    const ctx = tex.getContext();
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) fn(x, y, img.data, (y * w + x) * 4);
    }
    ctx.putImageData(img, 0, 0);
    tex.refresh();
  }

  makeBackground() {
    this.add.image(0, 0, 'bg').setOrigin(0);
    const tints = [0x7dffb6, 0x4dd6ff, 0x9b7bff, 0xff5d73];
    for (let i = 0; i < 14; i++) {
      const orb = this.add.image(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'orb'
      ).setTint(Phaser.Utils.Array.GetRandom(tints))
        .setScale(Phaser.Math.FloatBetween(0.35, 1))
        .setBlendMode(Phaser.BlendModes.ADD)
        .setAlpha(0.6);
      this.tweens.add({
        targets: orb,
        x: orb.x + Phaser.Math.Between(-80, 80),
        y: orb.y + Phaser.Math.Between(-120, 120),
        duration: Phaser.Math.Between(6000, 12000),
        yoyo: true, repeat: -1, ease: 'Sine.InOut',
      });
    }
  }

  addGlow(g, color, strength) {
    if (g.postFX) return g.postFX.addGlow(color, strength, 0, false, 0.1, 14);
  }

  makeCard(x, y, label, color) {
    const c = this.add.container(x, y);
    const bg = this.add.graphics()
      .fillStyle(0xffffff, 0.07).fillRoundedRect(-75, -48, 150, 96, 18)
      .lineStyle(2, 0xffffff, 0.12).strokeRoundedRect(-75, -48, 150, 96, 18);
    const title = this.add.text(0, -24, label, {
      fontFamily: FONT, fontSize: '20px', fontStyle: 'bold', color,
    }).setOrigin(0.5);
    const value = this.add.text(0, 16, '0', {
      fontFamily: FONT, fontSize: '40px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5);
    c.add([bg, title, value]);
    return { container: c, value };
  }

  setCard(key, v, bump = false) {
    const card = this.cards[key];
    card.value.setText(String(v));
    if (bump) this.tweens.add({ targets: card.container, scale: 1.1, duration: 120, yoyo: true });
  }

  makeOverlay() {
    const cx = W / 2, cy = BY + BOARD / 2;
    this.overlay = this.add.container(cx, cy).setDepth(20);
    const panel = this.add.graphics()
      .fillStyle(0x0d0b24, 0.78).fillRoundedRect(-220, -95, 440, 190, 26)
      .lineStyle(2, 0xffffff, 0.2).strokeRoundedRect(-220, -95, 440, 190, 26);
    this.overlayTitle = this.add.text(0, -32, '', {
      fontFamily: FONT, fontSize: '42px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5);
    this.overlaySub = this.add.text(0, 32, '', {
      fontFamily: FONT, fontSize: '20px', color: '#ffffff', align: 'center',
    }).setOrigin(0.5).setAlpha(0.8);
    this.overlay.add([panel, this.overlayTitle, this.overlaySub]);
  }

  showOverlay(title, sub, color = '#ffffff') {
    this.overlayTitle.setText(title).setColor(color);
    this.overlaySub.setText(sub);
    this.overlay.setVisible(true).setAlpha(0).setScale(0.85);
    this.tweens.add({ targets: this.overlay, alpha: 1, scale: 1, duration: 260, ease: 'Back.Out' });
  }

  hideOverlay() {
    this.tweens.add({
      targets: this.overlay, alpha: 0, scale: 0.9, duration: 160,
      onComplete: () => this.overlay.setVisible(false),
    });
  }

  drawSnake(flash = null) {
    const g = this.snakeG.clear();
    const n = this.snake.length;
    const pad = 5, size = CELL - pad * 2;
    const head = Phaser.Display.Color.ValueToColor(HEAD), tail = Phaser.Display.Color.ValueToColor(TAIL);
    const colorAt = i => {
      if (flash !== null) return flash;
      const c = Phaser.Display.Color.Interpolate.ColorWithColor(head, tail, Math.max(n - 1, 1), i);
      return Phaser.Display.Color.GetColor(c.r, c.g, c.b);
    };

    // Draw tail first so the head sits on top; bridge the gap between
    // neighbouring segments unless the pair straddles a wrapped edge.
    for (let i = n - 1; i >= 0; i--) {
      const s = this.snake[i], p = cellCenter(s.x, s.y);
      g.fillStyle(colorAt(i), 1);
      if (i < n - 1) {
        const t = this.snake[i + 1];
        if (Math.abs(t.x - s.x) + Math.abs(t.y - s.y) === 1) {
          const q = cellCenter(t.x, t.y), hz = p.y === q.y;
          g.fillRect(
            hz ? Math.min(p.x, q.x) : p.x - size / 2,
            hz ? p.y - size / 2 : Math.min(p.y, q.y),
            hz ? Math.abs(q.x - p.x) : size,
            hz ? size : Math.abs(q.y - p.y));
        }
      }
      const r = i === 0 ? 18 : 14;
      g.fillRoundedRect(p.x - size / 2, p.y - size / 2, size, size, r);
    }

    // Eyes look the way the snake is heading.
    const h = this.snake[0], p = cellCenter(h.x, h.y), d = this.dir;
    const fwd = 9, side = 11;
    [-1, 1].forEach(k => {
      const ex = p.x + d.x * fwd + (d.y ? k * side : 0);
      const ey = p.y + d.y * fwd + (d.x ? k * side : 0);
      g.fillStyle(0xffffff, 1).fillCircle(ex, ey, 7);
      g.fillStyle(0x10132b, 1).fillCircle(ex + d.x * 2.5, ey + d.y * 2.5, 3.6);
    });
  }

  drawFood() {
    const p = cellCenter(this.food.x, this.food.y);
    this.foodG.clear().setPosition(p.x, p.y)
      .fillStyle(FOOD, 1).fillCircle(0, 2, 17)
      .fillStyle(0xffffff, 0.55).fillCircle(-6, -4, 5)
      .fillStyle(0x7dffb6, 1).fillEllipse(6, -17, 12, 7);
    this.tweens.killTweensOf(this.foodG);
    this.foodG.setScale(0);
    this.tweens.add({
      targets: this.foodG, scale: 1, duration: 260, ease: 'Back.Out',
      onComplete: () => {
        this.tweens.add({
          targets: this.foodG, scale: 1.12, duration: 520, yoyo: true, repeat: -1, ease: 'Sine.InOut',
        });
      },
    });
  }

  // ---------- input ----------

  setupInput() {
    this.input.keyboard.on('keydown', e => {
      if (KEYS[e.code]) { e.preventDefault(); this.handleDir(KEYS[e.code]); }
      else if (e.code === 'Space' || e.code === 'KeyP' || e.code === 'Enter') { e.preventDefault(); this.handleAction(); }
    });

    let start = null;
    this.input.on('pointerdown', (p, over) => {
      start = over.includes(this.muteBtn) ? null : { x: p.x, y: p.y };
    });
    this.input.on('pointerup', p => {
      if (!start) return;
      const dx = p.x - start.x, dy = p.y - start.y;
      start = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return this.handleAction();
      this.handleDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });
  }

  handleDir(name) {
    const d = DIRS[name];
    if (this.state === 'over') return this.canRestart && this.reset();
    if (this.state === 'ready') {
      // The body trails to the left at the start, so ignore a reverse.
      if (d.x === -this.dir.x && d.y === -this.dir.y) return this.begin();
      this.dir = d;
      return this.begin();
    }
    if (this.state === 'paused') this.togglePause();
    const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
    if (d === last || (d.x === -last.x && d.y === -last.y) || this.queue.length >= 3) return;
    this.queue.push(d);
    Sfx.turn();
  }

  handleAction() {
    if (this.state === 'ready') this.begin();
    else if (this.state === 'over') { if (this.canRestart) this.reset(); }
    else this.togglePause();
  }

  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      this.showOverlay('Paused', 'Press Space or tap to continue');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      this.hideOverlay();
    }
  }

  // ---------- game loop ----------

  reset() {
    this.snake = [{ x: 3, y: 4 }, { x: 2, y: 4 }, { x: 1, y: 4 }];
    this.dir = DIRS.right;
    this.queue = [];
    this.score = 0;
    this.stepMs = START_MS;
    this.acc = 0;
    this.state = 'ready';
    this.setCard('score', 0);
    this.setCard('length', this.snake.length);
    this.spawnFood();
    this.drawSnake();
    this.showOverlay('Ready?', 'Press an arrow key or swipe to start', '#7dffb6');
  }

  begin() {
    this.state = 'playing';
    this.acc = 0;
    Sfx.start();
    this.hideOverlay();
  }

  spawnFood() {
    const taken = new Set(this.snake.map(s => s.y * N + s.x));
    const free = [];
    for (let i = 0; i < N * N; i++) if (!taken.has(i)) free.push(i);
    if (!free.length) return false;
    const i = Phaser.Utils.Array.GetRandom(free);
    this.food = { x: i % N, y: Math.floor(i / N) };
    this.drawFood();
    return true;
  }

  update(time, delta) {
    if (this.state !== 'playing') return;
    this.acc += delta;
    while (this.acc >= this.stepMs && this.state === 'playing') {
      this.acc -= this.stepMs;
      this.step();
    }
  }

  step() {
    if (this.queue.length) this.dir = this.queue.shift();
    const head = this.snake[0];
    const nx = (head.x + this.dir.x + N) % N, ny = (head.y + this.dir.y + N) % N;
    const eating = nx === this.food.x && ny === this.food.y;
    const body = eating ? this.snake : this.snake.slice(0, -1);
    if (body.some(s => s.x === nx && s.y === ny)) return this.gameOver();

    this.snake.unshift({ x: nx, y: ny });
    if (!eating) this.snake.pop();
    this.drawSnake();
    if (eating) this.eat();
  }

  eat() {
    this.score++;
    this.stepMs = Math.max(MIN_MS, this.stepMs - SPEEDUP);
    this.setCard('score', this.score, true);
    this.setCard('length', this.snake.length, true);
    Sfx.eat(this.score);

    const p = cellCenter(this.food.x, this.food.y);
    this.emitter.setParticleTint(FOOD);
    this.emitter.explode(26, p.x, p.y);

    if (this.score > this.best) {
      this.best = this.score;
      store.set('snake-best', this.best);
      this.setCard('best', this.best, true);
    }

    if (!this.spawnFood()) this.win();
  }

  gameOver() {
    this.state = 'over';
    Sfx.gameOver();
    this.cameras.main.shake(260, 0.012);
    let flashes = 0;
    this.time.addEvent({
      delay: 110, repeat: 5,
      callback: () => this.drawSnake(++flashes % 2 ? FOOD : null),
    });
    this.canRestart = false;
    this.time.delayedCall(700, () => {
      this.canRestart = true;
      this.showOverlay('Game over', `Score ${this.score}  ·  press any key or tap to retry`, '#ff5d73');
    });
  }

  win() {
    this.state = 'over';
    this.canRestart = true;
    this.foodG.clear();
    Sfx.win();
    this.emitter.setParticleTint(HEAD);
    for (let i = 0; i < 6; i++) {
      this.time.delayedCall(i * 150, () => this.emitter.explode(40,
        Phaser.Math.Between(BX, BX + BOARD), Phaser.Math.Between(BY, BY + BOARD)));
    }
    this.showOverlay('You win! 🎉', 'The snake filled the whole board', '#7dffb6');
  }
}

const start = () => new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  backgroundColor: '#0d0b24',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Game,
});

Promise.all([
  document.fonts.load('700 20px Fredoka'),
  document.fonts.load('500 20px Fredoka'),
]).catch(() => {}).finally(start);
</script>
</body>
</html>
