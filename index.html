<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noughts &amp; Crosses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d0b24; overflow: hidden; }
  #game { width: 100%; height: 100%; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
const W = 600, H = 900;
const CELL = 150, GAP = 12, BX = W / 2, BY = 505;
const COLORS = { X: 0xff5d73, O: 0x4dd6ff };
const CSS = { X: '#ff5d73', O: '#4dd6ff' };
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const FONT = 'Fredoka, system-ui, sans-serif';

const cellPos = i => ({
  x: BX + (i % 3 - 1) * (CELL + GAP),
  y: BY + (Math.floor(i / 3) - 1) * (CELL + GAP),
});

// Synthesised sound effects — no audio files needed.
const Sfx = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slideTo = null) {
    if (this.muted) return;
    this.init();
    const ctx = this.ctx, t = ctx.currentTime + delay;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  x()     { this.tone(480, 0.16, 'triangle', 0.25, 0, 820); },
  o()     { this.tone(620, 0.2, 'sine', 0.3, 0, 360); },
  click() { this.tone(700, 0.07, 'square', 0.06); },
  win() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.22, i * 0.09));
    this.tone(1568, 0.6, 'sine', 0.12, 0.38);
  },
  lose() { [440, 370, 311, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.18, i * 0.12)); },
  draw() { [392, 349].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.07, i * 0.16)); },
};

function winnerOf(b) {
  for (const line of LINES) {
    const [a, c, d] = line;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line };
  }
  return null;
}

function minimax(b, player, depth = 0) {
  const w = winnerOf(b);
  if (w) return { score: w.player === 'O' ? 10 - depth : depth - 10 };
  if (b.every(Boolean)) return { score: 0 };
  let best = { score: player === 'O' ? -Infinity : Infinity };
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = player;
    const s = minimax(b, player === 'O' ? 'X' : 'O', depth + 1).score;
    b[i] = null;
    if (player === 'O' ? s > best.score : s < best.score) best = { score: s, idx: i };
  }
  return best;
}

class Game extends Phaser.Scene {
  constructor() { super('game'); }

  create() {
    this.makeTextures();
    this.makeBackground();

    this.scores = { X: 0, O: 0, D: 0 };
    this.vsCpu = true;
    this.starter = 'X';
    this.marks = [];

    this.add.text(W / 2, 72, 'Noughts & Crosses', {
      fontFamily: FONT, fontSize: '50px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5).setShadow(0, 4, 'rgba(0,0,0,0.4)', 12);

    this.muteBtn = this.add.text(W - 34, 34, '🔊', { fontSize: '28px' })
      .setOrigin(0.5).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => {
        Sfx.muted = !Sfx.muted;
        this.muteBtn.setText(Sfx.muted ? '🔇' : '🔊');
      });

    this.scoreCards = {
      X: this.makeScoreCard(W / 2 - 170, 160, 'X', CSS.X),
      D: this.makeScoreCard(W / 2, 160, 'DRAW', '#c9c3ff'),
      O: this.makeScoreCard(W / 2 + 170, 160, 'O', CSS.O),
    };

    this.status = this.add.text(W / 2, 252, '', {
      fontFamily: FONT, fontSize: '30px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5);

    this.tiles = [];
    for (let i = 0; i < 9; i++) {
      const { x, y } = cellPos(i);
      const tile = this.add.graphics({ x, y });
      this.drawTile(tile, 0xffffff, 0.05, 0.12);
      this.tiles.push(tile);
      this.add.zone(x, y, CELL, CELL).setInteractive({ useHandCursor: true })
        .on('pointerover', () => { if (this.canClick(i)) this.drawTile(tile, COLORS[this.turn], 0.12, 0.4); })
        .on('pointerout', () => { if (!this.board[i] && !this.over) this.drawTile(tile, 0xffffff, 0.05, 0.12); })
        .on('pointerdown', () => { if (this.canClick(i)) this.play(i); });
    }

    this.emitter = this.add.particles(0, 0, 'spark', {
      speed: { min: 120, max: 460 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 600, max: 1100 },
      scale: { start: 1, end: 0 },
      gravityY: 350,
      blendMode: 'ADD',
      emitting: false,
    }).setDepth(10);

    this.makeButton(W / 2 - 135, 820, 230, 'New Game', () => this.newGame());
    this.modeBtn = this.makeButton(W / 2 + 135, 820, 230, '', () => {
      this.vsCpu = !this.vsCpu;
      this.updateModeLabel();
      this.scores = { X: 0, O: 0, D: 0 };
      Object.keys(this.scores).forEach(k => this.scoreCards[k].value.setText('0'));
      this.starter = 'X';
      this.newGame();
    });
    this.updateModeLabel();

    this.newGame(true);
  }

  makeTextures() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0xffffff, 1).fillCircle(6, 6, 6);
    g.generateTexture('spark', 12, 12);
    g.clear();
    for (let r = 64; r > 0; r -= 4) g.fillStyle(0xffffff, 0.03).fillCircle(64, 64, r);
    g.generateTexture('orb', 128, 128);
    g.destroy();
  }

  makeBackground() {
    this.add.graphics()
      .fillGradientStyle(0x2a1660, 0x2a1660, 0x07182f, 0x07182f, 1)
      .fillRect(0, 0, W, H);
    const tints = [0xff5d73, 0x4dd6ff, 0x9b7bff, 0xffc857];
    for (let i = 0; i < 14; i++) {
      const orb = this.add.image(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'orb'
      ).setTint(Phaser.Utils.Array.GetRandom(tints))
        .setScale(Phaser.Math.FloatBetween(1, 3))
        .setBlendMode(Phaser.BlendModes.ADD)
        .setAlpha(0.6);
      this.tweens.add({
        targets: orb,
        x: orb.x + Phaser.Math.Between(-80, 80),
        y: orb.y + Phaser.Math.Between(-120, 120),
        duration: Phaser.Math.Between(6000, 12000),
        yoyo: true, repeat: -1, ease: 'Sine.InOut',
      });
    }
  }

  makeScoreCard(x, y, label, color) {
    const c = this.add.container(x, y);
    const bg = this.add.graphics()
      .fillStyle(0xffffff, 0.07).fillRoundedRect(-75, -48, 150, 96, 18)
      .lineStyle(2, 0xffffff, 0.12).strokeRoundedRect(-75, -48, 150, 96, 18);
    const title = this.add.text(0, -24, label, {
      fontFamily: FONT, fontSize: '22px', fontStyle: 'bold', color,
    }).setOrigin(0.5);
    const value = this.add.text(0, 16, '0', {
      fontFamily: FONT, fontSize: '40px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5);
    c.add([bg, title, value]);
    return { container: c, value };
  }

  makeButton(x, y, w, label, onClick) {
    const h = 64;
    const c = this.add.container(x, y);
    const bg = this.add.graphics();
    const paint = a => bg.clear()
      .fillStyle(0xffffff, a).fillRoundedRect(-w / 2, -h / 2, w, h, 32)
      .lineStyle(2, 0xffffff, 0.3).strokeRoundedRect(-w / 2, -h / 2, w, h, 32);
    paint(0.1);
    const text = this.add.text(0, 0, label, {
      fontFamily: FONT, fontSize: '24px', fontStyle: 'bold', color: '#ffffff',
    }).setOrigin(0.5);
    c.add([bg, text]).setSize(w, h).setInteractive({ useHandCursor: true })
      .on('pointerover', () => { paint(0.18); this.tweens.add({ targets: c, scale: 1.05, duration: 120 }); })
      .on('pointerout', () => { paint(0.1); this.tweens.add({ targets: c, scale: 1, duration: 120 }); })
      .on('pointerdown', () => {
        Sfx.click();
        this.tweens.add({ targets: c, scale: 0.94, duration: 70, yoyo: true });
        onClick();
      });
    return { container: c, text };
  }

  updateModeLabel() {
    this.modeBtn.text.setText(this.vsCpu ? '🤖  vs CPU' : '👥  2 Players');
  }

  drawTile(g, color, fillAlpha, strokeAlpha) {
    const s = CELL / 2;
    g.clear()
      .fillStyle(color, fillAlpha).fillRoundedRect(-s, -s, CELL, CELL, 22)
      .lineStyle(2, color === 0xffffff ? 0xffffff : color, strokeAlpha).strokeRoundedRect(-s, -s, CELL, CELL, 22);
  }

  canClick(i) {
    return !this.over && !this.board[i] && !(this.vsCpu && this.turn === 'O');
  }

  setStatus(text, color = '#ffffff') {
    this.status.setText(text).setColor(color).setScale(0.8);
    this.tweens.add({ targets: this.status, scale: 1, duration: 250, ease: 'Back.Out' });
  }

  turnText() {
    if (this.vsCpu) return this.turn === 'X' ? 'Your turn' : 'CPU is thinking…';
    return `${this.turn}'s turn`;
  }

  newGame(first = false) {
    if (this.cpuTimer) this.cpuTimer.remove();
    this.board = Array(9).fill(null);
    this.turn = this.starter;
    this.over = false;

    const old = [...this.marks, this.winLine].filter(Boolean);
    this.tweens.add({
      targets: old, alpha: 0, scale: 0.4, duration: 200,
      onComplete: () => old.forEach(o => o.destroy()),
    });
    this.marks = [];
    this.winLine = null;

    this.tiles.forEach((t, i) => {
      this.drawTile(t, 0xffffff, 0.05, 0.12);
      t.setScale(first ? 0 : 0.85);
      this.tweens.add({ targets: t, scale: 1, duration: 400, delay: i * 40, ease: 'Back.Out' });
    });

    this.setStatus(this.turnText(), CSS[this.turn]);
    this.maybeCpuMove();
  }

  maybeCpuMove() {
    if (!this.vsCpu || this.over || this.turn !== 'O') return;
    this.cpuTimer = this.time.delayedCall(550, () => {
      const empty = this.board.map((v, i) => v ? null : i).filter(v => v !== null);
      const idx = Math.random() < 0.2
        ? Phaser.Utils.Array.GetRandom(empty)
        : minimax(this.board.slice(), 'O').idx;
      this.play(idx);
    });
  }

  play(i) {
    const p = this.turn;
    this.board[i] = p;
    this.drawTile(this.tiles[i], COLORS[p], 0.1, 0.35);
    this.marks.push(p === 'X' ? this.drawX(i) : this.drawO(i));
    p === 'X' ? Sfx.x() : Sfx.o();

    const win = winnerOf(this.board);
    if (win) return this.finish(win);
    if (this.board.every(Boolean)) return this.finish(null);

    this.turn = p === 'X' ? 'O' : 'X';
    this.setStatus(this.turnText(), CSS[this.turn]);
    this.maybeCpuMove();
  }

  addGlow(g, color) {
    if (g.postFX) g.postFX.addGlow(color, 4, 0, false, 0.1, 12);
  }

  drawX(i) {
    const { x, y } = cellPos(i);
    const g = this.add.graphics({ x, y });
    this.addGlow(g, COLORS.X);
    const s = 42, p = { t: 0 };
    const stroke = (x1, y1, x2, y2, k) => {
      const ex = x1 + (x2 - x1) * k, ey = y1 + (y2 - y1) * k;
      g.lineStyle(16, COLORS.X).lineBetween(x1, y1, ex, ey);
      g.fillStyle(COLORS.X).fillCircle(x1, y1, 8).fillCircle(ex, ey, 8);
    };
    this.tweens.add({
      targets: p, t: 2, duration: 320, ease: 'Sine.Out',
      onUpdate: () => {
        g.clear();
        stroke(-s, -s, s, s, Math.min(p.t, 1));
        if (p.t > 1) stroke(s, -s, -s, s, p.t - 1);
      },
    });
    return g;
  }

  drawO(i) {
    const { x, y } = cellPos(i);
    const g = this.add.graphics({ x, y });
    this.addGlow(g, COLORS.O);
    const p = { t: 0 };
    this.tweens.add({
      targets: p, t: 1, duration: 360, ease: 'Sine.Out',
      onUpdate: () => {
        const start = Phaser.Math.DegToRad(-90);
        g.clear().lineStyle(16, COLORS.O)
          .beginPath().arc(0, 0, 44, start, start + Math.PI * 2 * p.t).strokePath();
      },
    });
    return g;
  }

  finish(win) {
    this.over = true;
    this.starter = this.starter === 'X' ? 'O' : 'X';

    if (!win) {
      this.scores.D++;
      this.bumpScore('D');
      this.setStatus("It's a draw!", '#c9c3ff');
      Sfx.draw();
      this.cameras.main.shake(200, 0.004);
      return;
    }

    const { player, line } = win;
    this.scores[player]++;
    this.bumpScore(player);
    const text = this.vsCpu ? (player === 'X' ? 'You win! 🎉' : 'CPU wins!') : `${player} wins! 🎉`;
    this.setStatus(text, CSS[player]);
    (this.vsCpu && player === 'O') ? Sfx.lose() : Sfx.win();

    line.forEach(j => this.drawTile(this.tiles[j], COLORS[player], 0.28, 0.9));
    this.tweens.add({
      targets: line.map(j => this.marks.find(m => m.x === cellPos(j).x && m.y === cellPos(j).y)),
      scale: 1.15, duration: 220, yoyo: true, repeat: 2, ease: 'Sine.InOut', delay: 300,
    });

    const a = cellPos(line[0]), b = cellPos(line[2]);
    const ext = 0.2;
    const x1 = a.x - (b.x - a.x) * ext, y1 = a.y - (b.y - a.y) * ext;
    const x2 = b.x + (b.x - a.x) * ext, y2 = b.y + (b.y - a.y) * ext;
    const g = this.winLine = this.add.graphics().setDepth(5);
    this.addGlow(g, 0xffffff);
    const p = { t: 0 };
    this.tweens.add({
      targets: p, t: 1, duration: 380, delay: 250, ease: 'Cubic.Out',
      onUpdate: () => {
        const ex = x1 + (x2 - x1) * p.t, ey = y1 + (y2 - y1) * p.t;
        g.clear().lineStyle(10, 0xffffff).lineBetween(x1, y1, ex, ey)
          .fillStyle(0xffffff).fillCircle(x1, y1, 5).fillCircle(ex, ey, 5);
      },
      onComplete: () => {
        this.emitter.setParticleTint(COLORS[player]);
        line.forEach(j => { const c = cellPos(j); this.emitter.explode(30, c.x, c.y); });
        this.emitter.setParticleTint(0xffffff);
        this.emitter.explode(30, W / 2, BY);
        this.cameras.main.shake(180, 0.006);
      },
    });
  }

  bumpScore(key) {
    const { value, container } = this.scoreCards[key];
    value.setText(String(this.scores[key]));
    this.tweens.add({ targets: container, scale: 1.12, duration: 140, yoyo: true, ease: 'Sine.Out' });
  }
}

const start = () => new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  backgroundColor: '#0d0b24',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Game,
});

Promise.all([
  document.fonts.load('700 20px Fredoka'),
  document.fonts.load('500 20px Fredoka'),
]).catch(() => {}).finally(start);
</script>
</body>
</html>
